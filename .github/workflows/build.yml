name: Build Enzyme Grasshopper Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore enzGhPlugin.csproj

      - name: Extract version from csproj
        id: get_version
        run: |
          version=$(grep -o '<Version>[^<]*</Version>' enzGhPlugin.csproj | sed 's/<[^>]*>//g')
          if [ -z "$version" ]; then echo "Version not found in csproj" && exit 1; fi
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Extract package name from manifest
        id: get_pkg_name
        run: |
          pkg_name=$(grep '^name:' manifest.yml | sed 's/name:[[:space:]]*//')
          if [ -z "$pkg_name" ]; then echo "Package name not found in manifest.yml" && exit 1; fi
          echo "pkg_name=$pkg_name" >> $GITHUB_OUTPUT

      - name: Download Yak CLI
        run: |
          curl -L -o yak "https://files.mcneel.com/yak/tools/0.13.0/mac/yak"
          chmod +x yak

      - name: Build plugin
        run: dotnet build enzGhPlugin.csproj -c Release

      - name: Debug - List build output
        run: ls -la bin/Release/net48/

      - name: Upload built .gha artifact
        uses: actions/upload-artifact@v4
        with:
          name: enzyme-plugin-gha
          path: bin/Release/net48/enzyme.gha

      - name: Package .gha with Yak
        id: package_yak
        run: |
          if [ ! -f bin/Release/net48/enzyme.gha ]; then
            echo "enzyme.gha not found in bin/Release/net48/" && exit 1
          fi

          # Prepare Yak staging directory
          mkdir -p yakdir
          cp bin/Release/net48/enzyme.gha yakdir/
          cp manifest.yml yakdir/
          cp -r Resources yakdir/
          ls yakdir/

          # Substitute $version token in manifest
          version="${{ steps.get_version.outputs.version }}"
          echo "Building package for version: $version"
          sed -i '' "s/\$version/$version/" yakdir/manifest.yml

          # Build the .yak package
          cd yakdir
          ../yak build

          # Locate the generated .yak file and copy it to the repo root
          yak_file=$(ls *.yak 2>/dev/null | head -1)
          if [ -z "$yak_file" ]; then echo "No .yak file was created" && exit 1; fi
          cp "$yak_file" ..
          echo "Created package: $yak_file"
          echo "yak_file=$yak_file" >> $GITHUB_OUTPUT

      - name: Push package (.yak) to Yak server
        env:
          YAK_TOKEN: ${{ secrets.YAK_TOKEN }}
        if: env.YAK_TOKEN != ''
        run: |
          yak_filename="${{ steps.package_yak.outputs.yak_file }}"
          if [ -z "$yak_filename" ]; then echo "No .yak filename provided" && exit 1; fi
          echo "Pushing: $yak_filename"
          ./yak push "$yak_filename"

      - name: Create GitHub Release with .gha file
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Enzyme Plugin v${{ steps.get_version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          body: |
            Automated release for Enzyme Grasshopper plugin v${{ steps.get_version.outputs.version }}

            This release contains the Enzyme Grasshopper plugin (.gha file) for installation.

            ## Installation
            ### Via Rhino Package Manager (recommended)
            1. In Rhino, run the command `PackageManager`
            2. Search for "Enzyme-Grasshopper-Plugin"
            3. Click "Install"

            ### Manual installation
            1. Download the `.gha` file below
            2. Place it in your Grasshopper Libraries folder
          files: |
            bin/Release/net48/enzyme.gha
          draft: false
          prerelease: false
          generate_release_notes: false
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-docs:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

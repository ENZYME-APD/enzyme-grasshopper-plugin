name: Build Enzyme Grasshopper Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET Framework
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore enzGhPlugin.csproj

      - name: Extract version from csproj
        id: get_version
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content enzGhPlugin.csproj
          $version = $csproj.SelectSingleNode("//PropertyGroup/Version").InnerText
          if (-not $version) { throw "Version not found in csproj" }
          echo "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Extract package name from manifest
        id: get_pkg_name
        shell: pwsh
        run: |
          $manifest = Get-Content manifest.yml | Out-String
          if ($manifest -match 'name:\s*(.+)') {
            $pkgName = $matches[1].Trim()
            echo "pkg_name=$pkgName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            throw "Package name not found in manifest.yml"
          }

      - name: Download Yak CLI
        shell: pwsh
        run: |
          curl -L -o yak.exe "https://files.mcneel.com/yak/tools/latest/yak.exe"

      - name: Yank previous version from Yak
        env:
          YAK_TOKEN: ${{ secrets.YAK_TOKEN }}
        if: env.YAK_TOKEN != ''
        shell: pwsh
        run: |
          $pkgName = "${{ steps.get_pkg_name.outputs.pkg_name }}"
          $searchOutput = ./yak.exe search $pkgName
          $versions = $searchOutput | Select-String "\($pkgName\)\s+\(([^)]+)\)" | ForEach-Object { $_.Matches.Groups[1].Value }
          foreach ($version in $versions) {
            Write-Output "Yanking version $version"
            ./yak.exe yank $pkgName $version --api-key $env:YAK_TOKEN
          }

      - name: Build plugin
        run: msbuild enzGhPlugin.csproj /p:Configuration=Release

      - name: Debug - List build output
        shell: pwsh
        run: |
          dir bin/Release/net48 -Recurse

      - name: Upload built .gha artifact
        uses: actions/upload-artifact@v4
        with:
          name: enzyme-plugin-gha
          path: bin/Release/net48/enzyme.gha

      - name: Package .gha with Yak
        id: package_yak
        shell: pwsh
        run: |
          if (-not (Test-Path bin/Release/net48/enzyme.gha)) { throw "enzyme.gha not found in bin/Release/net48/" }
          # Create a temporary directory for Yak packaging
          New-Item -ItemType Directory -Path yakdir -Force
          Copy-Item -Path bin/Release/net48/enzyme.gha -Destination yakdir
          Copy-Item -Path manifest.yml -Destination yakdir
          Copy-Item -Path Resources -Destination yakdir -Recurse
          dir yakdir
          cd yakdir
          $version = "${{ steps.get_version.outputs.version }}"
          Write-Output "Extracted version: $version"
          $manifestContent = Get-Content manifest.yml -Raw
          $updatedManifestContent = $manifestContent -replace '\$version', $version
          $updatedManifestContent | Out-File -Path manifest.yml -Force
          ..\yak.exe build
                
          # Find the created .yak file and copy it back to the root directory
          $yakFile = Get-ChildItem *.yak | Select-Object -First 1
          if (-not $yakFile) { throw "No .yak file was created" }
          Copy-Item $yakFile.FullName -Destination ..
          Write-Output "Created package: $($yakFile.Name)"
          echo "yak_file=$($yakFile.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Push package (.yak)
        env:
          YAK_TOKEN: ${{ secrets.YAK_TOKEN }}
        if: env.YAK_TOKEN != ''
        shell: pwsh
        run: |
          $yakFilename = "${{ steps.package_yak.outputs.yak_file }}"
          if (-not $yakFilename) { throw "No .yak file found" }
          dir yakdir
          $yakFilepath = Join-Path -Path "yakdir" -ChildPath $yakFilename
          ./yak.exe push $yakFilepath --api-key "$env:YAK_TOKEN"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Enzyme Plugin v${{ steps.get_version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          body: |
            Automated release for Enzyme Grasshopper plugin.
            See the attached files for the plugin binaries.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload .gha to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/Release/net48/enzyme.gha
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

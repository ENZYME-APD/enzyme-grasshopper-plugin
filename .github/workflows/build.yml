name: Build Enzyme Grasshopper Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET Framework
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore enzGhPlugin.csproj

      - name: Extract version from csproj
        id: get_version
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content enzGhPlugin.csproj
          $version = $csproj.Project.PropertyGroup.Version
          echo "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Extract package name from manifest
        id: get_pkg_name
        shell: pwsh
        run: |
          $manifest = Get-Content manifest.yml | Out-String
          if ($manifest -match 'name:\s*(.+)') {
            $pkgName = $matches[1].Trim()
            echo "pkg_name=$pkgName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Yank previous version from Yak
        env:
          YAK_TOKEN: ${{ secrets.YAK_TOKEN }}
        shell: pwsh
        run: |
          $pkgName = "${{ steps.get_pkg_name.outputs.pkg_name }}"
          $result = ./yak.exe search $pkgName
          if ($result -match "$pkgName \(([\d\.]+)\)") {
            $prevVersion = $matches[1]
            Write-Host "Yanking previous version $prevVersion"
            ./yak.exe yank $pkgName $prevVersion --api-key $env:YAK_TOKEN
          } else {
            Write-Host "No previous version found to yank."
          }

      - name: Build plugin
        run: msbuild enzGhPlugin.csproj /p:Configuration=Release

      - name: Upload built .gha artifact
        uses: actions/upload-artifact@v4
        with:
          name: enzyme-plugin-gha
          path: bin/Release/net48/enzyme.gha

      - name: Download Yak CLI
        run: |
          Invoke-WebRequest -Uri "https://github.com/mcneel/yak/releases/download/3.13.0/yak.exe" -OutFile yak.exe

      - name: Package .gha with Yak
        run: |
          ./yak.exe pack bin/Release/net48/enzyme.gha --manifest manifest.yml --version ${{ steps.get_version.outputs.version }}

      - name: Push package (.yak)
        env:
          YAK_TOKEN: ${{ secrets.YAK_TOKEN }}
        run: |
          $package = Get-ChildItem *.yak | Select-Object -First 1
          ./yak.exe push $package --api-key $env:YAK_TOKEN

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Enzyme Plugin v${{ steps.get_version.outputs.version }}
          tag_name: v${{ steps.get_version.outputs.version }}
          body: |
            Automated release for Enzyme Grasshopper plugin.
            See the attached files for the plugin binaries.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload .gha to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/Release/net48/enzyme.gha
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
name: TEMP Yak on Linux test (no publish)
on:
  push:
    branches: [claude/base-component]
    paths: ['.github/workflows/yak-linux-test.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet build enzGhPlugin.csproj -c Release
      - name: Download Yak CLI (linux)
        run: |
          curl -fL -o yak "https://files.mcneel.com/yak/tools/0.13.0/linux-x64/yak"
          chmod +x yak && ./yak version
      - name: Package (no push)
        run: |
          mkdir -p yakdir && cp bin/Release/net48/enzyme.gha manifest.yml yakdir/ && cp -r Resources yakdir/
          sed -i "s/\$version/9.9.9-test/" yakdir/manifest.yml
          cd yakdir && ../yak build && ls -la *.yak
          echo "::notice::Built $(ls *.yak)"
